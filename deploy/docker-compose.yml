# SIGNOO on one droplet: Postgres + the API + Caddy (HTTPS and the console).
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Only Caddy publishes ports. The database and the API are reachable from the other
# containers and from nowhere else.
name: signoo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: signoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: signoo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signoo -d signoo"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        SIGNOO_CODE_COMMIT: ${SIGNOO_CODE_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SIGNOO_ENV: production
      SIGNOO_DATABASE_URL: postgresql+psycopg2://signoo:${POSTGRES_PASSWORD}@db:5432/signoo
      SIGNOO_JWT_SECRET: ${SIGNOO_JWT_SECRET:?set SIGNOO_JWT_SECRET in deploy/.env}
      SIGNOO_KIOSK_TOKEN: ${SIGNOO_KIOSK_TOKEN:?set SIGNOO_KIOSK_TOKEN in deploy/.env}
      SIGNOO_KIOSK_TOKEN_MODE: ${SIGNOO_KIOSK_TOKEN_MODE:-per_kiosk}
      SIGNOO_AUTO_TRAIN: ${SIGNOO_AUTO_TRAIN:-1}
      SIGNOO_AUTO_TRAIN_LANGUAGES: ${SIGNOO_AUTO_TRAIN_LANGUAGES:-liu}
      SIGNOO_AUTO_TRAIN_HOURS: ${SIGNOO_AUTO_TRAIN_HOURS:-72}
      SIGNOO_RETENTION_DAYS: ${SIGNOO_RETENTION_DAYS:-30}
      SIGNOO_WORKERS: ${SIGNOO_WORKERS:-1}
    volumes:
      # Training runs, their checkpoints, and the frozen benchmark. Losing this volume loses
      # every model the fleet downloads from and the benchmark every candidate is judged on.
      - runs:/app/server/runs
      # What the server writes for the kiosks to read when they share a disk (dev only);
      # kept on a volume so a rebuild does not wipe the published knowledge bases.
      - kbdata:/app/kiosk/data

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SIGNOO_DOMAIN: ${SIGNOO_DOMAIN:?set SIGNOO_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  runs:
  kbdata:
  caddy_data:
  caddy_config:
